<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kometa — админ-панель</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e2230; --line: #2a2f3f;
    --text: #e8eaf0; --muted: #98a0b3; --accent: #6ea8fe; --ok: #45c07d;
    --warn: #f0b054; --err: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: .4px; }
  nav { display: flex; gap: 14px; flex-wrap: wrap; }
  nav a { color: var(--muted); padding: 4px 0; }
  nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 26px 0 10px; color: var(--muted); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 13px; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  .muted { color: var(--muted); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: #24503a; }
  .pill.warn { color: var(--warn); border-color: #4d3c22; }
  .pill.err { color: var(--err); border-color: #55292c; }
  form.inline { display: inline-flex; gap: 6px; align-items: center; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  input[type=number] { width: 78px; }
  textarea { width: 100%; min-height: 90px; }
  button {
    background: var(--accent); color: #0b0d12; border: 0; border-radius: 8px;
    padding: 7px 13px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button.danger { background: transparent; color: var(--err); border: 1px solid #55292c; font-weight: 500; }
  .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  .flash.ok { background: #16301f; color: #a7e6c1; }
  .flash.err { background: #33191c; color: #f3b6b6; }
  .login { max-width: 380px; margin: 12vh auto; }
  code { background: var(--panel-2); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .trunc { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
</style>
</head>
<body>
<header>
  <div class="logo">🛰 Kometa</div>
  {% if session_active %}
  <nav>
    <a href="/admin" class="{{ 'active' if page == 'dashboard' else '' }}">Дашборд</a>
    <a href="/admin/orders" class="{{ 'active' if page == 'orders' else '' }}">Заказы</a>
    <a href="/admin/users" class="{{ 'active' if page == 'users' else '' }}">Пользователи</a>
    <a href="/admin/nodes" class="{{ 'active' if page == 'nodes' else '' }}">Ноды</a>
  </nav>
  <div style="margin-left:auto"><a href="/admin/logout">Выйти</a></div>
  {% endif %}
</header>
<main>
  {% if message %}<div class="flash ok">{{ message }}</div>{% endif %}
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
