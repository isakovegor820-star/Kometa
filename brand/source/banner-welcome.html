<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kometa — баннер приветствия 1280×720</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .frame { width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Kometa — защищённое подключение без тормозов"
     font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="26%" cy="24%" r="105%">
      <stop offset="0%"   stop-color="#178f63"/>
      <stop offset="32%"  stop-color="#0d6b4a"/>
      <stop offset="64%"  stop-color="#053a29"/>
      <stop offset="100%" stop-color="#021a12"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="120" y1="760" x2="1320" y2="80">
      <stop offset="0%"   stop-color="#4dffae" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#4dffae" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#d8ff66" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="286" y2="0">
      <stop offset="0%"   stop-color="#2bc57f"/>
      <stop offset="34%"  stop-color="#45e698"/>
      <stop offset="72%"  stop-color="#8ff8aa"/>
      <stop offset="100%" stop-color="#dcff5c"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38ffa0" stop-opacity="0.32"/>
      <stop offset="62%"  stop-color="#17c877" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#17c877" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="100" y1="220" x2="620" y2="360">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#e6fff2"/>
      <stop offset="100%" stop-color="#b6ffd8"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="46%" r="78%">
      <stop offset="50%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000c08" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34" result="far"/>
      <feGaussianBlur stdDeviation="9"  result="near"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="near"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>
  <rect width="1440" height="810" fill="url(#sweep)"/>

  <!-- орбиты -->
  <g fill="none" stroke="#7dffbe" stroke-linecap="round">
    <circle cx="1190" cy="380" r="330" stroke-width="2.5" opacity="0.13"
            stroke-dasharray="230 1843" transform="rotate(-18 1190 380)"/>
    <circle cx="1190" cy="380" r="408" stroke-width="2.5" opacity="0.07"
            stroke-dasharray="96 2467" transform="rotate(150 1190 380)"/>
  </g>

  <ellipse cx="1190" cy="375" rx="430" ry="360" fill="url(#aura)"/>

  <!-- знак кометы-стрелы -->
  <g transform="translate(1200 380) rotate(-42) scale(1.25) translate(-152 0)">
    <g filter="url(#glow)" opacity="0.7">
      <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z"
            fill="#3ceb95"/>
    </g>
    <g fill="url(#mark)" opacity="0.6">
      <circle cx="-16" cy="8" r="8"/>
      <circle cx="-46" cy="18" r="5" opacity="0.75"/>
    </g>
    <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z"
          fill="url(#mark)"/>
    <path d="M 22 -7 C 66 -17 116 -32 178 -38" fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" opacity="0.2" filter="url(#soft)"/>
  </g>

  <!-- текстовая колонка -->
  <g>
    <text x="112" y="212" font-size="23" font-weight="600" letter-spacing="5.5" fill="#6ff2a8">TELEGRAM-БОТ</text>

    <text x="106" y="352" font-size="132" font-weight="800" letter-spacing="-3" fill="url(#word)">KOMETA</text>

    <text x="112" y="416" font-size="33" font-weight="500" fill="#a9f0c8">
      Защищённое подключение<tspan fill="#7cf7ab"> · </tspan>без тормозов
    </text>

    <!-- чипы преимуществ -->
    <g font-size="24" font-weight="600" fill="#dcffee">
      <g>
        <rect x="110" y="486" width="286" height="70" rx="35" fill="#ffffff" opacity="0.07"/>
        <rect x="110" y="486" width="286" height="70" rx="35" fill="none" stroke="#7cf7ab" stroke-width="1.5" opacity="0.3"/>
        <text x="142" y="531" fill="#7cf7ab">∞</text>
        <text x="186" y="531">Безлимит</text>
      </g>
      <g>
        <rect x="420" y="486" width="320" height="70" rx="35" fill="#ffffff" opacity="0.07"/>
        <rect x="420" y="486" width="320" height="70" rx="35" fill="none" stroke="#7cf7ab" stroke-width="1.5" opacity="0.3"/>
        <text x="452" y="531" fill="#7cf7ab">◎</text>
        <text x="496" y="531">До 3 устройств</text>
      </g>
      <g>
        <rect x="764" y="486" width="236" height="70" rx="35" fill="#ffffff" opacity="0.07"/>
        <rect x="764" y="486" width="236" height="70" rx="35" fill="none" stroke="#7cf7ab" stroke-width="1.5" opacity="0.3"/>
        <text x="796" y="531" fill="#7cf7ab">◍</text>
        <text x="840" y="531">2 локации</text>
      </g>
    </g>

    <!-- акцентная плашка -->
    <g>
      <rect x="110" y="612" width="392" height="76" rx="38" fill="#dcff5c" opacity="0.14"/>
      <rect x="110" y="612" width="392" height="76" rx="38" fill="none" stroke="#dcff5c" stroke-width="1.5" opacity="0.45"/>
      <text x="148" y="660" font-size="27" font-weight="700" fill="#dcff5c">🎁 Первые 3 дня — бесплатно</text>
    </g>
  </g>

  <rect width="1440" height="810" fill="url(#vig)"/>
  <rect width="1440" height="810" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
</div>
</body>
</html>
