<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kometa — комета-стрела роста">
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="98%">
      <stop offset="0%"   stop-color="#1aab75"/>
      <stop offset="30%"  stop-color="#0e7350"/>
      <stop offset="62%"  stop-color="#06432f"/>
      <stop offset="100%" stop-color="#02231a"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="40" y1="470" x2="440" y2="60">
      <stop offset="0%"   stop-color="#4dffae" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#4dffae" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d8ff66" stop-opacity="0.05"/>
    </linearGradient>

    <!-- тело кометы: изумруд в хвосте → лайм на острие -->
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="286" y2="0">
      <stop offset="0%"   stop-color="#2bc57f"/>
      <stop offset="34%"  stop-color="#45e698"/>
      <stop offset="72%"  stop-color="#8ff8aa"/>
      <stop offset="100%" stop-color="#dcff5c"/>
    </linearGradient>

    <linearGradient id="trailFade" gradientUnits="userSpaceOnUse" x1="-210" y1="0" x2="-40" y2="0">
      <stop offset="0%"   stop-color="#000000"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="trailMask"><rect x="-260" y="-160" width="290" height="320" fill="url(#trailFade)"/></mask>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38ffa0" stop-opacity="0.30"/>
      <stop offset="62%"  stop-color="#17c877" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#17c877" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="50%" cy="46%" r="74%">
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000c08" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" result="far"/>
      <feGaussianBlur stdDeviation="7"  result="near"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="near"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sweep)"/>

  <!-- орбита -->
  <g transform="translate(256 256)" fill="none" stroke="#7dffbe" stroke-linecap="round">
    <circle r="208" stroke-width="2.5" opacity="0.14" stroke-dasharray="168 1140" transform="rotate(-4)"/>
    <circle r="208" stroke-width="2.5" opacity="0.07" stroke-dasharray="62 1246" transform="rotate(154)"/>
  </g>

  <ellipse cx="282" cy="238" rx="214" ry="186" fill="url(#aura)"/>

  <g transform="translate(256 256) rotate(-42) scale(1.15) translate(-152 0)">

    <!-- догоняющие искры -->
    <g fill="url(#mark)" opacity="0.6">
      <circle cx="-16" cy="8" r="8"/>
      <circle cx="-46" cy="18" r="5" opacity="0.75"/>
    </g>

    <!-- свечение тела -->
    <g filter="url(#glow)" opacity="0.75">
      <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z" fill="#3ceb95"/>
    </g>

    <!-- тело: конусный хвост + наконечник -->
    <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z"
          fill="url(#mark)"/>

    <!-- глянцевый блик по верхней кромке -->
    <path d="M 22 -7 C 66 -17 116 -32 178 -38" fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" opacity="0.20" filter="url(#soft)"/>

  </g>

  <rect width="512" height="512" fill="url(#vig)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
