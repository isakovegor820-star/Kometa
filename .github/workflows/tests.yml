name: tests

# Релизный гейт: тесты идут на push и на pull request, на той же версии Python,
# что и прод (Dockerfile: python:3.12-slim). Раньше зелёный прогон ничего не
# гарантировал: 40 тестов падали из-за рассинхрона настроек, а двойной -q прятал
# итоговую строку (аудит готовности 08.10.2026). Теперь падение видно и в PR.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Тесты
        # Каталог data/ и .env не нужны: conftest готовит временную БД и
        # выставляет пустые платёжные доступы, поэтому наружу ничего не уходит.
        run: python -m pytest -q --tb=short

      - name: Проверка синтаксиса и импортов приложения
        run: python -m compileall -q app
