[pytest]
asyncio_mode = auto
testpaths = tests
# Без -q в addopts: раньше он складывался с -q из командной строки, уровень
# падал до -2 и итоговая строка «N passed» не печаталась — релизный гейт
# выглядел зелёным, даже когда тесты падали (находка аудита 08.10.2026).
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
