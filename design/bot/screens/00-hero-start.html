<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Kometa — hero /start: баннер приветствия 16:9</title>
<style>
  html, body { margin: 0; padding: 0; background: #05080a; }
  /* Канва ровно 1600x900: экспорт идёт с масштабом 2 → 3200x1800, дальше даунсемпл
     в 1280x720 командой sips. Отдельная обёртка .out — то, что уходит в Telegram. */
  .out { width: 1440px; height: 810px; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="out">
<svg viewBox="0 0 1440 810" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Kometa — добро пожаловать"
     font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <!-- Фон: тёмный космос в фирменном изумруде, свет слева-сверху, как в знаке. -->
    <radialGradient id="bg" cx="30%" cy="20%" r="115%">
      <stop offset="0%"   stop-color="#0b5b3f"/>
      <stop offset="28%"  stop-color="#074a33"/>
      <stop offset="58%"  stop-color="#04291e"/>
      <stop offset="100%" stop-color="#02100b"/>
    </radialGradient>

    <!-- Аура за знаком: единственное «яркое» пятно кадра. -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3affa4" stop-opacity="0.34"/>
      <stop offset="52%"  stop-color="#1ad07f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#17c877" stop-opacity="0"/>
    </radialGradient>

    <!-- Тело кометы: изумруд в хвосте → лайм на острие (brand/avatar/kometa-avatar.svg). -->
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
      <stop offset="0%"   stop-color="#2bc57f"/>
      <stop offset="34%"  stop-color="#45e698"/>
      <stop offset="72%"  stop-color="#8ff8aa"/>
      <stop offset="100%" stop-color="#dcff5c"/>
    </linearGradient>

    <!-- Лайм→циан: только тонкая орбита, чтобы «космос» читался, но не спорил с брендом. -->
    <linearGradient id="orbit" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#35d6e8" stop-opacity="0.55"/>
      <stop offset="52%"  stop-color="#8ff8aa" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#dcff5c" stop-opacity="0.62"/>
    </linearGradient>

    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="300" y1="520" x2="1140" y2="620">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="62%"  stop-color="#eafff4"/>
      <stop offset="100%" stop-color="#c8ffdd"/>
    </linearGradient>

    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="1040" y2="0">
      <stop offset="0%"   stop-color="#45e698" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8ff8aa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#dcff5c" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="46%" r="76%">
      <stop offset="48%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000a06" stop-opacity="0.62"/>
    </radialGradient>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="34" result="far"/>
      <feGaussianBlur stdDeviation="9"  result="near"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="near"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Звёздная пыль: статичная россыпь, детерминированная (без random в рантайме). -->
    <g id="stars">
      <circle cx="115" cy="118" r="1.7" fill="#c8ffe4" opacity="0.55"/>
      <circle cx="218" cy="196" r="1.1" fill="#ffffff" opacity="0.40"/>
      <circle cx="176" cy="352" r="1.4" fill="#c8ffe4" opacity="0.34"/>
      <circle cx="86"  cy="536" r="1.2" fill="#ffffff" opacity="0.28"/>
      <circle cx="257" cy="704" r="1.6" fill="#c8ffe4" opacity="0.40"/>
      <circle cx="137" cy="812" r="1.1" fill="#ffffff" opacity="0.24"/>
      <circle cx="376" cy="86"  r="1.2" fill="#ffffff" opacity="0.34"/>
      <circle cx="470" cy="164" r="1.5" fill="#c8ffe4" opacity="0.30"/>
      <circle cx="1267" cy="132" r="1.6" fill="#c8ffe4" opacity="0.46"/>
      <circle cx="1190" cy="248" r="1.1" fill="#ffffff" opacity="0.30"/>
      <circle cx="1325" cy="382" r="1.4" fill="#c8ffe4" opacity="0.36"/>
      <circle cx="1224" cy="576" r="1.2" fill="#ffffff" opacity="0.26"/>
      <circle cx="1121" cy="700" r="1.5" fill="#c8ffe4" opacity="0.34"/>
      <circle cx="1296" cy="792" r="1.1" fill="#ffffff" opacity="0.22"/>
      <circle cx="1040" cy="96"  r="1.2" fill="#ffffff" opacity="0.28"/>
      <circle cx="967" cy="828" r="1.4" fill="#c8ffe4" opacity="0.26"/>
      <circle cx="576" cy="128" r="1.1" fill="#ffffff" opacity="0.22"/>
      <circle cx="882" cy="768" r="1.2" fill="#ffffff" opacity="0.20"/>
    </g>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>

  <!-- Диагональный «разгон»: намёк на траекторию кометы. -->
  <path d="M -80 900 L 1680 40" stroke="#4dffae" stroke-width="1.6" opacity="0.06"/>
  <path d="M -80 820 L 1680 -40" stroke="#d8ff66" stroke-width="1.2" opacity="0.04"/>

  <use href="#stars"/>

  <!-- Орбиты: два тонких кольца вокруг знака. -->
  <g transform="translate(720 268)" fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <circle r="252" stroke-width="1.6" opacity="0.30" stroke-dasharray="196 1388" transform="rotate(-8)"/>
    <circle r="252" stroke-width="1.2" opacity="0.18" stroke-dasharray="74 1510" transform="rotate(148)"/>
    <circle r="312" stroke-width="1" opacity="0.10" stroke-dasharray="40 940" transform="rotate(62)"/>
  </g>

  <ellipse cx="726" cy="258" rx="300" ry="262" fill="url(#aura)"/>

  <!-- Знак «комета-стрела»: та же геометрия, что в аватаре, повёрнута по композиции. -->
  <g transform="translate(720 268) rotate(-20) scale(0.9) translate(-152 0)">
    <g fill="url(#mark)" opacity="0.55">
      <circle cx="-18" cy="9" r="9"/>
      <circle cx="-52" cy="20" r="5.5" opacity="0.72"/>
      <circle cx="-84" cy="30" r="3.4" opacity="0.5"/>
    </g>
    <g filter="url(#glow)" opacity="0.72">
      <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z" fill="#3ceb95"/>
    </g>
    <path d="M 0 0 C 46 -12 108 -32 186 -40 L 186 -76 L 286 0 L 186 76 L 186 40 C 108 32 46 12 0 0 Z"
          fill="url(#mark)"/>
    <path d="M 22 -7 C 66 -17 116 -32 178 -38" fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" opacity="0.20" filter="url(#soft)"/>
  </g>

  <!-- Разделительная линия: держит оптическую связку «знак → слово». -->
  <rect x="470" y="512" width="500" height="1.6" fill="url(#rule)"/>

  <!-- Слово: единственный крупный текст кадра. Дальше всё несёт подпись сообщения. -->
  <text x="720" y="600" text-anchor="middle" fill="url(#word)"
        font-size="58" font-weight="600" letter-spacing="11.6">ДОБРО ПОЖАЛОВАТЬ</text>

  <!-- Три факта: коротко, без иконок — в картинке иконки мельчают. -->
  <g font-size="22" font-weight="500" fill="#cdf7e2" text-anchor="middle" opacity="0.92">
    <text x="452" y="666">Безлимитный трафик</text>
    <text x="668" y="666">3 дня бесплатно</text>
    <text x="896" y="666">Телефон и ноутбук</text>
  </g>
  <g fill="#45e698" opacity="0.6">
    <circle cx="596" cy="659" r="2.8"/>
    <circle cx="812" cy="659" r="2.8"/>
  </g>

  <text x="720" y="712" text-anchor="middle" fill="#6ee7a8" opacity="0.55"
        font-size="17" font-weight="600" letter-spacing="6.4">KOMETA</text>

  <rect width="1440" height="810" fill="url(#vig)"/>
  <rect width="1440" height="810" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
</div>
</body>
</html>
